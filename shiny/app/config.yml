# config.yml
default:
  # Static directories (exist before any analysis)
  # Baked into the image at /opt/met4all/cache via M4A_CACHE_DIR; falls back to
  # a local cache dir when the variable is unset (RStudio dev container).
  cache: !expr if (nzchar(Sys.getenv("M4A_CACHE_DIR"))) Sys.getenv("M4A_CACHE_DIR") else "cache"
  # Overridable so the results tree can live outside the image, which HPC
  # runtimes (Apptainer/Singularity) require because they mount it read-only.
  data: !expr if (nzchar(Sys.getenv("M4A_DATA_DIR"))) Sys.getenv("M4A_DATA_DIR") else "data"
  filter:                   "common_files/filter"
  custom_color_palette:     "common_files/custom_color_palette"
  pathways:                 "common_files/pathways"

  # Analysis subdirectories (created per session, relative to analysis_dir)
  subdirs:
    logs:           "logs"
    input:          "input"
    results:        "results"
    preprocessing:  "results/1-preprocessing"
    qc:             "results/2-qc"
    beta:           "results/3-beta"
    mds:            "results/4-mds"
    pca:            "results/5-pca"
    umap:           "results/6-umap"
    heatmap:        "results/7-heatmap"
    global_met:     "results/8-global_methylation"
    differential:   "results/9-differential_methylation"
    cnv:            "results/10-cnv"

  # Annotation
  annotation_pkg: "IlluminaHumanMethylationEPICanno.ilm10b4.hg19"
  
  # Geneset Pathways
  gene_set:
    kegg: "c2.cp.kegg.v7.0.symbols.gmt"
    hallmark: "h.all.v7.0.symbols.gmt"
