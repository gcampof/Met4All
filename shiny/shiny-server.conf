run_as shiny;
preserve_logs true;

# Keep the R process alive for an hour after the last user disconnects.
#
# The default is 5 seconds, which is wrong for this app in two ways. It discards
# the annotation cache and the worker pool, so the next visitor pays the rebuild
# (~26 s per worker) again. Worse, the analysis workers are children of this
# process: a user who starts a 40-minute run and closes the tab would have that
# run killed a few seconds later.
app_idle_timeout 3600;

server {
  listen 3838;
  location / {
    site_dir /srv/shiny-server;
    log_dir /var/log/shiny-server;
    directory_index on;
  }
}
